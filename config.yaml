# PlanktoScan AI - single source of truth for paths, classes and hyperparameters.
# Every training/eval run copies the resolved version of this file into runs/<id>/.

project:
  name: planktoscan-ai
  seed: 42                    # fixed seed for python/numpy/torch
  deterministic: true         # cudnn deterministic mode (slightly slower)
  device: auto                # auto | cuda | cpu  (GPU-optional)

paths:                        # relative to the project root
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed     # leakage-safe split crops (train/val/test)
  synthetic_data: data/synthetic     # generated YOLO frames, per split
  models: models
  runs: runs
  results: results

data:
  dataset: zoolake
  # Verified via the Eawag Open Data API (record linked from the paper's data statement).
  # Only data.zip is used; the 4.8 GB model zip and the code zip are NOT downloaded.
  zoolake:
    doi: 10.25678/0004DY
    paper_doi: 10.3389/fmicb.2021.746297
    url: https://opendata.eawag.ch/dataset/52b6ba86-5ecb-448c-8c01-eec7cb209dc7/resource/1cc785fa-36c2-447d-bb11-92ce1d1f3f2d/download/data.zip
    filename: data.zip
    size_bytes: 492466237
    sha256: ce038e19af73dd5aff0beb9ed0dc012bb0314efeb341337667b62d1e1c383d4f
    images_subdir: data/zooplankton_0p5x         # one folder per raw class
    expected_images: 17943
    expected_classes: 35
  max_download_gb_without_asking: 1.0
  # Project class -> raw ZooLake classes (approved by the user in Phase 2).
  # 7 organism classes + "reject" = 8 classes, 14,048 images.
  class_mapping:
    copepod: [cyclops, eudiaptomus]
    diatom: [asterionella, fragilaria, diatom_chain]
    nauplius: [nauplius]
    cladoceran: [daphnia, diaphanosoma, bosmina]
    rotifer: [asplanchna, brachionus, conochilus, kellicottia, keratella_cochlearis,
              keratella_quadrata, polyarthra, rotifers, synchaeta, trichocerca]
    ceratium: [ceratium]
    dinobryon: [dinobryon]
    # Not countable as a target organism: debris, moulted exoskeletons, and "unknown"
    # objects, which per the dataset README may include fragments of zooplankton/algae.
    reject: [dirt, unknown, copepod_skins, daphnia_skins]
  reject_class: reject
  # Open-set evaluation only (3,895 images). NEVER used for training or threshold tuning.
  open_set: [maybe_cyano, unknown_plankton, uroglena, paradileptus, filament,
             aphanizomenon, fish, leptodora, hydra, chaoborus]
  split:
    train: 0.70
    val: 0.15
    test: 0.15
    block: day                       # whole-day blocks, class-stratified
    stratify_on: [target, raw_class] # balance project classes AND raw subtypes jointly
    drop_duplicate_files: true       # byte-identical files: dedupe; drop both if labels conflict
    fallback_block: hour             # only for a class whose val/test cannot be filled
    fallback_min_fill: 0.5           # val/test < 50% of its target share -> fallback
    min_test_images_warn: 30
  leakage:
    phash_max_distance: 4            # stage 1: candidate pairs (Hamming distance, 64-bit pHash)
    confirm_pixel_corr: 0.98         # stage 2: candidate is a near-duplicate if 64x64 gray corr >= this
    small_image_px: 32               # pHash unreliable below this (min side), reported separately

preprocess:
  # One function (src/preprocess/enhance.py::preprocess) used identically in training and inference.
  # Applied to each CROP before the classifier (decided by the Phase 3 ablation: classifier.use_preprocess).
  illumination:
    enabled: true
    method: border_median            # border_median: subtract per-channel median of the crop border
                                     # (dark-field background level); gaussian_subtract: for full frames
    sigma_frac: 0.25                 # gaussian_subtract only: blur sigma as a fraction of max side
  denoise:
    enabled: true
    method: nl_means                 # nl_means | bilateral | none
    h: 5                             # small: crops are tiny (median 72x76 px)
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_px: 32                      # tile size in pixels -> grid adapts to the image size

classifier:
  backbone: efficientnet_b0          # timm name
  pretrained: false                  # no cached ImageNet weights and downloads are not allowed
  image_size: 128                    # aspect-preserving resize + pad (black = dark-field background)
  batch_size: 64
  epochs: 40
  lr: 1.0e-3                         # from scratch -> higher LR than fine-tuning
  weight_decay: 0.05
  warmup_epochs: 2
  label_smoothing: 0.1
  class_weighting: none              # none | inverse_sqrt_freq  (chosen by val macro F1 in Phase 4)
  use_preprocess: true               # Phase 3: val macro F1 0.8621 vs 0.8608 without (results/ablation.csv); within noise
  amp: true
  num_workers: 0                     # augmentation runs on the GPU in batches; no worker processes
  early_stopping_patience: 10
  selection_metric: macro_f1         # best checkpoint chosen by val macro F1
  augment:
    hflip: true
    vflip: true
    rotation_deg: 180                # plankton have no canonical orientation in the water
    scale: [0.9, 1.1]
    brightness: 0.15
    contrast: 0.15

uncertainty:
  # Threshold on max softmax probability, chosen on the VAL split only (scripts.choose_threshold):
  # smallest threshold whose accepted (non-uncertain) val predictions reach this accuracy.
  target_accepted_accuracy: 0.97

synthetic:
  image_size: 640
  frames: {train: 2000, val: 300, test: 300}  # each split uses ONLY its own crops (asserted)
  organisms_per_frame: [3, 15]
  max_crop_side_px: 192              # larger crops are downscaled to this (keeps frames realistic)
  scale_range: [0.8, 1.25]           # around native pixel size; crops are already small
  rotation_deg: 180
  max_overlap_iou: 0.3
  alpha_low: 6                       # alpha ramps from (border level + low) ...
  alpha_high: 30                     # ... to (border level + high) gray levels
  mask_feather_px: 2
  min_box_px: 4                      # skip a crop whose visible mask is smaller than this
  background:
    base_level: [3, 14]              # dark-field background gray level
    glow_strength: [0, 22]           # uneven illumination: low-frequency glow
    noise_std: [1.0, 6.0]
    debris_specks: [0, 25]           # tiny unlabeled specks (smaller than min_box_px)
  single_class_detector: true        # detector finds "object"; the classifier names it or rejects it

detector:
  model: yolov8n.yaml                # built from scratch (no pretrained .pt available offline)
  image_size: 640
  batch_size: 8                      # 4 GB VRAM
  epochs: 100
  time_hours: 1.25                   # hard cap (budget 90 min incl. eval)
  patience: 20
  amp: true
  workers: 2
  preprocess_frames: false           # frame-level preprocessing not used (see viva notes)
  nms_iou_grid: [0.3, 0.45, 0.6, 0.75]
  conf_grid_step: 0.01
  match_iou: 0.5                     # IoU for counting a detection as correct (F1 / counting)

pipeline:
  crop_padding: 0.1
  min_box_area_px: 16

evaluation:
  bootstrap_resamples: 1000
  bootstrap_unit: day                # resample whole days: images within a day are correlated

report:
  formats: [csv, html, pdf]
